[project]
name = "bsky-starter-pack-block"
version = "0.1.0"
description = "Block all users from a Bluesky starter pack or list"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = ["atproto>=0.0.65"]

[dependency-groups]
dev = ["pyrefly", "ruff>=0.2.2", "vermin>=1.7.0"]

[tool.ruff]
line-length = 79
target-version = "py312"
src = ["bsky.py", "test_bsky.py"]

[tool.ruff.lint]
select = [
    # Core & Style
    "E",
    "W",
    "F",
    "I",
    "N",
    "UP",
    "YTT",
    "Q",
    "COM",
    "ISC",
    # Docstrings
    "D",
    "FLY",
    # Typing & Annotations
    "ANN",
    "FA",
    "PYI",
    "TC",
    # Correctness & Bugs
    "B",
    "A",
    "C4",
    "PIE",
    "SIM",
    "RET",
    "ARG",
    "PTH",
    "INT",
    "SLF",
    # Performance & Modernization
    "PERF",
    "FURB",
    "SLOT",
    # Safety, Exceptions & Quality
    "S",
    "BLE",
    "TRY",
    "EM",
    "RSE",
    "ASYNC",
    "DTZ",
    "T10",
    "PGH",
    "ERA",
    "EXE",
    "ICN",
    "LOG",
    "G",
    "FBT",
    # Pylint
    "PL",
    # Ruff Specific
    "RUF",
]
ignore = [
    "E501",
    "ISC001",
    "COM812",
    "ANN401",  # use Any in **kwargs
    "PLR0911",  # many early returns in retry state machines
    "PLR0912",  # many branches in retry state machines
    "PLR0913",
    "PLR2004",
    "S311",
    "D107",  # init docstrings are documented at class level
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"test_*.py" = ["D", "S101", "SLF001", "ANN001", "ANN201", "ANN202", "PLR2004"]
"bsky.py" = ["T201"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.flake8-type-checking]
strict = true

[tool.ruff.lint.flake8-annotations]
mypy-init-return = true
suppress-none-returning = true

[tool.pyrefly]
project-includes = ["bsky.py"]
project-excludes = [".venv"]
python-version = "3.12"
preset = "strict"

[tool.pyrefly.errors]
assert-type = true
bad-override = true
bad-specialization = true
bad-context-manager = true
implicitly-defined-attribute = true
inconsistent-overload = true
invalid-overload = true
missing-attribute = true
no-access = true
redundant-cast = true
unbound-name = true
implicit-any-attribute = true
untyped-import = "ignore"
missing-import = "ignore"
